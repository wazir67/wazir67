  <circle cx="214" cy="129" r="11" fill="#080D19" stroke="url(#acc)" stroke-width="3"/>
  <circle cx="214" cy="129" r="5" fill="#2DD4BF"><animate attributeName="r" values="4;6.5;4" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="248" y="126" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E8EEF8">Project Leader<tspan fill="#5C6C88" font-weight="400">  @  </tspan><tspan fill="#2DD4BF" font-weight="700">Dabluete</tspan></text>
  <text x="248" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">High-end multi-tenant SaaS: ERP, CRM, healthcare, education, hospitality and AI</text>
  <text x="248" y="170" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">products.</text>
  <text x="186" y="230" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#8A9BB5">2024 — now</text>
  <circle cx="214" cy="225" r="11" fill="#080D19" stroke="url(#acc)" stroke-width="3"/>
  <circle cx="214" cy="225" r="5" fill="#2DD4BF"><animate attributeName="r" values="4;6.5;4" dur="2.4s" repeatCount="indefinite"/></circle>
  <text x="248" y="222" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E8EEF8">Team Leader<tspan fill="#5C6C88" font-weight="400">  @  </tspan><tspan fill="#2DD4BF" font-weight="700">Saviors</tspan></text>
  <text x="248" y="246" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">Custom solutions for overseas clients, plus support of their existing systems.</text>
  <text x="186" y="326" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#8A9BB5">2019 — 2024</text>
  <circle cx="214" cy="321" r="11" fill="#080D19" stroke="url(#acc)" stroke-width="3"/>
  <circle cx="214" cy="321" r="4" fill="#5C6C88"/>
  <text x="248" y="318" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E8EEF8">Software Engineer<tspan fill="#5C6C88" font-weight="400">  @  </tspan><tspan fill="#2DD4BF" font-weight="700">ABCtechnologies</tspan></text>
  <text x="248" y="342" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">IoT platforms with PLC integration and thermodynamic calculation software; mentored</text>
  <text x="248" y="362" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">5 engineers.</text>
  <text x="186" y="422" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" font-weight="600" fill="#8A9BB5">2018 — 2021</text>
  <circle cx="214" cy="417" r="11" fill="#080D19" stroke="url(#acc)" stroke-width="3"/>
  <circle cx="214" cy="417" r="4" fill="#5C6C88"/>
  <text x="248" y="414" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="700" fill="#E8EEF8">MSCS<tspan fill="#5C6C88" font-weight="400">  @  </tspan><tspan fill="#2DD4BF" font-weight="700">Muhammad Ali Jinnah University</tspan></text>
  <text x="248" y="438" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15" fill="#8A9BB5">Master of Science in Computer Science.</text>
