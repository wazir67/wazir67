  <text x="582" y="174" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.8" fill="#5C6C88" font-weight="600">ALSO</text>
  <text x="650" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E8EEF8">Team Leader @ Saviors</text>
  <text x="582" y="218" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.8" fill="#5C6C88" font-weight="600">BASE</text>
  <text x="650" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E8EEF8">Karachi, Pakistan</text>
  <text x="582" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.8" fill="#5C6C88" font-weight="600">STUDY</text>
  <text x="650" y="262" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E8EEF8">MSCS, Muhammad Ali Jinnah Univ.</text>
  <text x="582" y="306" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.8" fill="#5C6C88" font-weight="600">FOCUS</text>
  <text x="650" y="306" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="15.5" font-weight="600" fill="#E8EEF8">SaaS · ERP/CRM · AI · IoT</text>
