  <text x="48" y="112" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">Software engineer and project lead with 7+ years</text>
  <text x="48" y="140" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">of experience designing and delivering web,</text>
  <text x="48" y="168" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">mobile and IoT software for business clients.</text>
  <text x="48" y="196" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">Expert-level PHP developer across Laravel,</text>
  <text x="48" y="224" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">CodeIgniter, React, TypeScript, Flutter and</text>
  <text x="48" y="252" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">Python, turning client requirements into</text>
  <text x="48" y="280" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">reliable, production-ready systems. Experienced</text>
  <text x="48" y="308" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">in leading onshore and offshore teams and</text>
  <text x="48" y="336" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">shipping multi-tenant SaaS, ERP, CRM and real-</text>
  <text x="48" y="364" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" fill="#C3D0E6">time data platforms.</text>
  <rect x="560" y="92" width="392" height="248" rx="16" fill="#ffffff" fill-opacity="0.035" stroke="#1B2740"/>
  <text x="582" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" letter-spacing="1.8" fill="#5C6C88" font-weight="600">ROLE</text>
